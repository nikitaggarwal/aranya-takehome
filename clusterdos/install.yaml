---
# clusterdOS install manifest for the aranya-takehome cluster.
#
# Vendored from https://gitlab.com/aranya-tech/public/clusterdos.git @ v0.3.21,
# customized with:
#   - clusterdos.clustername  = "aranya-takehome"
#   - gitapps.certmanager     enabled (required)
#   - gitapps.metricsserver   enabled (required)
#   - gitapps.nfd             enabled (required)
#   - gitapps.ksm             enabled (optional extra — kube-state-metrics pairs with metrics-server
#                                       to give cluster-state visibility)
#
# Note: gitapps.cilium is deliberately LEFT DISABLED because Cilium was installed
# by kubespray at cluster-bootstrap time; enabling it here would conflict.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clusterdos
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    name: in-cluster
    namespace: argocd
  project: default
  syncPolicy:
    automated:
      prune: true
      allowEmpty: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
  source:
    repoURL: 'https://gitlab.com/aranya-tech/public/clusterdOS.git'
    path: metadeployment/
    targetRevision: v0.3.21
    helm:
      valuesObject:
        clusterdos:
          clustername: aranya-takehome
          ref: v0.3.21
        gitapps:
          certmanager:
            enabled: true
            # Override the chart's default `featureGates: ExperimentalGatewayAPISupport=true`.
            # That gate requires Gateway API CRDs to be installed first; we haven't
            # installed them (nothing in our deliverables needs Gateway API), and
            # without them cert-manager-controller crashloops on startup with:
            #   "the Gateway API CRDs do not seem to be present, but
            #    ExperimentalGatewayAPISupport is set to true"
            values:
              featureGates: ""
              config:
                enableGatewayAPI: false
          crossplane:
            enabled: false
          ksm:
            enabled: true       # optional extra (kube-state-metrics)
          lgtm:
            enabled: false
          metricsserver:
            enabled: true
            # Append --kubelet-insecure-tls to the chart's defaultArgs.
            # Kubespray-generated kubelet TLS certs list hostnames in their SAN
            # but not the kubelet's eth1 IP. Without this flag, metrics-server
            # tries to scrape `https://10.120.0.X:10250/` and fails TLS
            # verification: "cannot validate certificate for 10.120.0.X
            # because it doesn't contain any IP SANs".
            values:
              args:
                - --kubelet-insecure-tls
          nfd:
            enabled: true
          nvidiagpuoperator:
            enabled: false
          rook:
            enabled: false
          wekafs:
            enabled: false
          tailscale:
            enabled: false
          traefik:
            enabled: false
          inference:
            enabled: false
          slurm:
            enabled: false
